name: Daily Drive Radio episode

on:
  schedule:
    # 13:00 UTC = 6:00 AM US Pacific during PDT (daylight saving). Shifts to
    # 5:00 AM Pacific once clocks fall back to PST in November — change the
    # hour here if you'd rather it stay pinned to 6:00 AM local year-round.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-episode:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out existing published site (previous episodes + feed)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: out

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Cache Kokoro model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-kokoro-82m

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate today's episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
        run: |
          mkdir -p out
          python -m drive_radio.main

      # Publish immediately after the owner's own episode, before
      # multi-tenant even starts. Measured in CI: the single-user episode
      # alone takes ~10 minutes on the shared runner, and multi-tenant adds
      # a further ~10-15 min per user on top — if publish waited for all of
      # that, the owner's own daily feed (what this whole pipeline exists
      # for) could still be unpublished well into the morning. Publishing
      # twice means it's never held hostage by anyone else's generation.
      - name: Publish to GitHub Pages (owner's episode)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          publish_branch: gh-pages
          keep_files: false

      # Multi-tenant is new and still being proven out — continue-on-error
      # so a bug here can never block anything above. Nothing pulled from
      # Supabase here is a credential yet (no per-user API keys until BYOK
      # ships), so no ::add-mask:: is needed for now — revisit this the
      # moment that changes.
      - name: Generate episodes for app users (multi-tenant)
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PODCAST_BASE_URL: ${{ vars.PODCAST_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m drive_radio.multi_tenant

      - name: Publish to GitHub Pages (app users' episodes)
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: out
          publish_branch: gh-pages
          keep_files: false

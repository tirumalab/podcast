[project]
name = "drive-radio"
version = "0.1.0"
description = "Generates a personalized daily two-host audio news briefing and publishes it as a podcast feed."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "kokoro>=0.9.4",
    "feedparser>=6.0.11",
    "requests>=2.32.0",
    "feedgen>=1.0.0",
    "pydub>=0.25.1",
    "python-dateutil>=2.9.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["drive_radio"]
